[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potofgold"
version = "0.2.0"
description = "Representation learning and evolutionary search for 0DTE options research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Julia Goloshubina"}]
dependencies = [
    "torch==2.11.0",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.1",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
reports = ["matplotlib==3.9.2", "seaborn==0.13.2", "pandas==2.2.2"]
search = ["pandas==2.2.2", "pyarrow==16.1.0", "pymoo==0.6.1.6"]

[project.scripts]
potofgold-generate-data = "potofgold.sim_tools.simulation:main"
potofgold-pack-data = "potofgold.sim_tools.simulation:pack_main"
potofgold-inspect = "potofgold.sim_tools.inspection:main"
potofgold-train = "potofgold.encoder.train:main"
potofgold-embed = "potofgold.encoder.inference:main"
potofgold-evaluate = "potofgold.analysis.evaluate:main"
potofgold-report = "potofgold.analysis.report:main"
potofgold-search-generate-data = "potofgold.evolutionary_search.sim_tools.simulation:main"
potofgold-search-prepare = "potofgold.evolutionary_search.input_tools.prepare:main"
potofgold-search = "potofgold.evolutionary_search.search.run:main"
potofgold-search-replay = "potofgold.evolutionary_search.search.replay:main"
potofgold-search-evaluate = "potofgold.evolutionary_search.analysis.evaluate:main"
potofgold-search-report = "potofgold.evolutionary_search.analysis.report:main"

[project.urls]
Repository = "https://github.com/jgol/pot-of-gold"

[tool.setuptools.package-dir]
"" = "transformer/src"
"potofgold" = "transformer/src/potofgold"
"potofgold.evolutionary_search" = "evolutionary_search/src/potofgold/evolutionary_search"

[tool.setuptools]
packages = [
    "potofgold",
    "potofgold.encoder",
    "potofgold.analysis",
    "potofgold.sim_tools",
    "potofgold.evolutionary_search",
    "potofgold.evolutionary_search.search",
    "potofgold.evolutionary_search.input_tools",
    "potofgold.evolutionary_search.sim_tools",
    "potofgold.evolutionary_search.analysis",
]

[tool.setuptools.package-data]
"potofgold.encoder" = ["variate_names.json"]
